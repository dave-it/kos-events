    ## Frequently asked questions

    ### Where is the race?

    In Winterleiten, a 30-minute drive from the town of Judenburg. Address: Winterleitenhüttenstraße 1, 8750 Judenburg. [Ice Cross Downhill Track Winterleiten on Google Maps](https://maps.app.goo.gl/nu9BX7nzKUZPTQin7). Please keep in mind that you may need snow chains to reach the track by car.

    ### How do I get to Winterleiten?

    - **Car:** There are routes via Obdach and via Judenburg. When it snows, the route via Judenburg is recommended. Snow chains and winter tyres are a good idea.
    - **Plane:** The nearest airport is Graz Thalerhof. Vienna is also an option, but further away.
    - **Train:** Travel to Judenburg station. There is currently no public transport for the last kilometres up the mountain.

    ### Is it possible to train before the event?

    There are training times prior to the event. During race week, training is Monday to Thursday from 17:00 to 19:00. All trainings need to be booked via [Training](/training). As soon as the track is ready (approx. New Year) we publish additional training times.

    ### Will there be skate sharpening on site?

    We do not offer skate sharpening on site. In emergencies we have a skate sharpener on duty in Zeltweg (35 minutes from the track). Contact the organizers to use this service.

    ### Where to stay?

    We partner with the Art Hotel Spielberg. Find out more [here](/hotel).

    ### Do I need blade guards?

    Yes, please bring your own blade guards.

    ### Will there be prize money?

    The competition will have no prize money this year.

    ### Changing rooms and parking?

    Changing rooms are provided, and female athletes have a separate changing room. Athletes can park on site for free.

    ### Is there food on site?

    Yes, food is available for riders on site and at the accommodation. Coupons for food and drinks are handed out at registration.

    ### Is there an ATM?

    The nearest ATMs are in Judenburg and Obdach. You can pay everything by card on site.

    ### Is there an after party?

    Yes, there will be an after party on site.

    ### Can I ski nearby?

    Yes, for example at Lachtal, Riesneralm, Obdach and Kreischberg.

    ### Still questions?

    Contact us at [info@ice-cross.at](mailto:info@ice-cross.at).
