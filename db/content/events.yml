    ## Häufige Fragen

    ### Wo findet das Rennen statt?

    Auf der Winterleiten, etwa 30 Minuten von Judenburg entfernt. Adresse: Winterleitenhüttenstraße 1, 8750 Judenburg. [Ice Cross Downhill Track Winterleiten auf Google Maps](https://maps.app.goo.gl/nu9BX7nzKUZPTQin7)

    ### Wie komme ich nach Winterleiten?

    - **Auto:** Es gibt eine Strecke über Obdach und eine über Judenburg. Bei Schneefall ist die Strecke über Judenburg zu empfehlen, Schneeketten und Winterreifen sind eine gute Idee.
    - **Flugzeug:** Der nächste Flughafen ist Graz Thalerhof. Wien ist auch eine Option, aber weiter entfernt.
    - **Zug:** Anreise bis zum Bahnhof Judenburg. Für die letzten Kilometer auf den Berg gibt es aktuell keine öffentlichen Verkehrsmittel.

    ### Kann man vor dem Rennen trainieren?

    Es gibt den gesamten Winter die Möglichkeit, auf der Strecke zu trainieren. In der Rennwoche gibt es jeweils am Vormittag und am Abend Trainingslots. Mehr dazu unter [Training](/training).

    ### Kann ich meine Skates vor Ort schleifen lassen?

    Nein, vor Ort gibt es keinen Schleifservice. Die nächste Möglichkeit ist Zeltweg, etwa 35 Minuten entfernt.

    ### Gibt es ein Hotel in der Nähe?

    Ja, bei unserem Partnerhotel in Spielberg. Mehr Informationen: [Art Hotel Spielberg](/hotel).

    ### Brauche ich Kufenschoner?

    Ja, bitte bring eigene Kufenschoner mit.

    ### Gibt es Preisgeld?

    Nein, wir haben dieses Jahr kein Preisgeld.

    ### Gibt es Umkleiden und Parkplätze?

    Ja, es gibt Umkleiden, auch einen separaten Umkleideraum für die Damen. Athletinnen und Athleten parken gratis direkt an der Strecke.

    ### Gibt es Essen vor Ort?

    Ja, vor Ort und in der Unterkunft gibt es Essen für die Fahrer. Coupons für Essen und Getränke gibt es bei der Registrierung.

    ### Gibt es einen Bankomaten?

    Die nächsten Bankomaten sind in Judenburg und Obdach. Vor Ort kannst du alles mit Karte bezahlen.

    ### Gibt es eine Afterparty?

    Ja, vor Ort findet eine Afterparty statt.

    ### Kann man in der Nähe Ski fahren?

    Ja, zum Beispiel in Lachtal, Riesneralm, Obdach und Kreischberg.

    ### Du hast noch Fragen?

    Schreib uns an [info@ice-cross.at](mailto:info@ice-cross.at).
