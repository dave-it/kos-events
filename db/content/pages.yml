- slug: mitglied-werden
  nav: footer
  position: 1
  title_de: Mitglied werden
  title_en: Become a member
  body_de: |
    ## Werde jetzt Mitglied!

    | Mitgliedschaft | Beitrag |
    |---|---|
    | Reguläres Mitglied | 50 € pro Jahr |
    | Kinder & Jugend | 40 € pro Jahr |
    | Unterstützendes Mitglied | 15 € pro Jahr |

    Neben den günstigeren Trainingspreisen gibt es für reguläre Mitglieder ein Gratis-Training. Mit der unterstützenden Mitgliedschaft hilfst du Ice Cross Austria, ohne selbst zu trainieren. Kinder und Jugendliche zahlen einen vergünstigten Beitrag.

    ## Deine Vorteile

    - **Informationen zuerst:** Alles zum aktuellen Zustand der Strecke, zu Trainingsmöglichkeiten und Events geht zuerst an unsere Mitglieder.
    - **Finanzielle Vorteile:** Mitglieder zahlen bei jedem Training weniger und können um Unterstützung für internationale Bewerbe ansuchen.
    - **Österreichisches Team-Jersey:** Mitglieder können ein offizielles Team-Österreich-Jersey bestellen. Ice Cross Austria übernimmt aktuell 50 % der Kosten.
    - **Internationale Vertretung:** Ice Cross Austria ist Mitglied des internationalen Verbandes ATSX und damit stets über Regeländerungen und wichtige Informationen informiert.

    ## Mitglied werden

    Schreib uns eine E-Mail an [info@ice-cross.at](mailto:info@ice-cross.at) mit deinem Namen und der gewünschten Mitgliedschaft. Wir melden uns bei dir.
  body_en: |
    ## Become a member today!

    | Membership | Fee |
    |---|---|
    | Regular member | €50 per year |
    | Children & youth | €40 per year |
    | Supporting member | €15 per year |

    Besides cheaper training prices, regular members get one free training. As a supporting member you help Ice Cross Austria without training yourself. Children and teenagers pay a reduced fee.

    ## Your benefits

    - **First to know:** Everything about track conditions, training options and events goes to our members first.
    - **Financial benefits:** Members pay less for every training and can apply for support for international competitions.
    - **Austrian team jersey:** Members can order an official Team Austria jersey. Ice Cross Austria currently covers 50% of the cost.
    - **International representation:** Ice Cross Austria is a member of the international federation ATSX and is always up to date on rule changes and important information.

    ## Become a member

    Send us an email at [info@ice-cross.at](mailto:info@ice-cross.at) with your name and the membership you want. We will get back to you.

- slug: heats
  nav: footer
  position: 2
  title_de: Heats und Qualifikation
  title_en: Heats and qualification
  body_de: |
    ## Die Grundlagen

    - Vier Athleten starten gemeinsam auf ein Signal.
    - Es gilt, eine vereiste Strecke bergab mit diversen Hindernissen zu überwinden.
    - Die beiden Schnelleren kommen weiter in die nächste Runde.
    - Absichtlicher Körperkontakt (Bodychecks, Zurückhalten) ist verboten.

    ## Die Qualifikation

    Bevor es zu viert an die Startaufstellung geht, muss sich jede Athletin und jeder Athlet allein auf der Strecke beweisen. Es werden zwei Durchgänge gefahren, wobei die bessere Zeit zur Reihung verwendet wird. Die zweite Zeit dient als Tie-Breaker bei gleich schnellen Zeiten. Eine gute Qualifikationszeit ist der Schlüssel zu einem erfolgreichen Rennen, denn man qualifiziert sich nicht nur, sondern hat auch Vorteile bei der Wahl der Startposition.

    Nach dem Zeitfahren gibt es drei Gruppen von Fahrern:

    - Direkt für das Hauptrennen qualifiziert
    - Qualifiziert für den LCQ (Last Chance Qualifier)
    - Ausgeschieden

    ## LCQ und Heats

    Der Last Chance Qualifier (LCQ) ist eine Art Vorrennen und die Möglichkeit für Athletinnen und Athleten mit schlechter Qualifikation, sich doch noch für das Hauptrennen zu qualifizieren. Beispiel: 100 Fahrer haben sich angemeldet. Die besten 32 qualifizieren sich direkt für das Hauptrennen. Die Platzierungen 33 bis 96 fahren die restlichen 32 Plätze für das Hauptrennen aus.

    Als Heat werden in manchen Wettkampfsportarten, etwa Skicross, Shorttrack oder Rallycross, Startgruppen bezeichnet. Im Ice Cross Downhill besteht ein Heat immer aus vier Personen. Startet eine Person nicht, wird das als Did Not Start (DNS) gewertet.

    Sowohl die Platzierung in den Heats und im LCQ als auch die Qualifikationszeit haben Einfluss auf die Platzierung im Gesamtergebnis.

    ## Wer startet wo?

    Die Auswahl der Startgates erfolgt nach der Reihung in der Qualifikation. Die langsamste Fahrerin oder der langsamste Fahrer bekommt das Startgate, das am Schluss übrig bleibt. Stehen alle Fahrer auf ihren Positionen, gibt der Startschiedsrichter das Kommando „Riders ready! Five seconds warning“. Die Zeit danach ist variabel: Typischerweise vergehen 3 bis 7 Sekunden bis zum akustischen und visuellen Startsignal.

    ## Die Zielgerade

    Auf den letzten Metern wird es oft knapp, ein Fotofinish ist keine Seltenheit. Es zählt der vorderste Punkt der Kufe des Eislaufschuhs. Rückwärts durch das Ziel zu fahren zahlt sich also nicht aus.

    ## Wer gehört in welchen Heat?

    Auf den ersten Blick wirkt die Aufteilung nach den Qualifikationszeiten willkürlich. Sie folgt aber drei einfachen Grundregeln:

    1. Alle Fahrer werden gleichmäßig aufgeteilt.
    2. Der schnellere Fahrer erhält die bessere Ausgangslage.
    3. Ein Platz Unterschied darf die Ausgangslage nicht sprunghaft ändern.

    Beispiel mit 32 Fahrern: Da pro Heat 4 Fahrer starten, bilden wir 4 Gruppen mit je 8 Fahrern. Gruppe 1 sind die Plätze 1 bis 8, Gruppe 2 die Plätze 9 bis 16, Gruppe 3 die Plätze 17 bis 24 und Gruppe 4 die Plätze 25 bis 32. In jedem Heat fährt ein Fahrer aus jeder Gruppe. Damit der Schnellste die beste Ausgangslage bekommt, startet er gegen den Langsamsten:

    - Heat 1: 01 – 16 – 17 – 32
    - Heat 2: 08 – 09 – 24 – 25

    Da immer zwei Fahrer weiterkommen, bilden zwei Heats der ersten Runde einen Heat der nächsten Runde (Sieger aus Heat 1 und Heat 2 treffen aufeinander). Die beiden Schnellsten sollen sich erst im Finale begegnen, deshalb liegt der Zweitschnellste im ersten Heat der unteren Hälfte, der Drittschnellste ebenfalls unten, der Viertschnellste oben.

    ### Heat-Raster für 64 Fahrer

    | Heat | Startplätze |
    |---|---|
    | 01 | 01 – 32 – 33 – 64 |
    | 02 | 16 – 17 – 48 – 49 |
    | 03 | 08 – 25 – 40 – 57 |
    | 04 | 09 – 24 – 41 – 56 |
    | 05 | 04 – 29 – 36 – 61 |
    | 06 | 13 – 20 – 45 – 52 |
    | 07 | 05 – 28 – 37 – 60 |
    | 08 | 12 – 21 – 44 – 53 |
    | 09 | 02 – 31 – 34 – 63 |
    | 10 | 15 – 18 – 47 – 50 |
    | 11 | 07 – 26 – 39 – 58 |
    | 12 | 10 – 23 – 42 – 55 |
    | 13 | 03 – 30 – 35 – 62 |
    | 14 | 14 – 19 – 46 – 51 |
    | 15 | 06 – 27 – 38 – 59 |
    | 16 | 11 – 22 – 43 – 54 |

    Wie ein Rennen ausgeht, siehst du im Heatbaum jedes Events unter [Ergebnisse](/events).
  body_en: |
    ## The basics

    - Four athletes start together on a signal.
    - They race down an icy track with various obstacles.
    - The two faster ones advance to the next round.
    - Deliberate body contact (body checks, holding back) is forbidden.

    ## Qualification

    Before the four-rider heats, every athlete has to prove themselves alone on the track. Two runs are made, and the better time is used for ranking. The second time is the tie-breaker for equal times. A good qualification time is the key to a successful race: you not only qualify, but also get an advantage when choosing your start position.

    After the time trial there are three groups of riders:

    - Directly qualified for the main race
    - Qualified for the LCQ (Last Chance Qualifier)
    - Eliminated

    ## LCQ and heats

    The Last Chance Qualifier (LCQ) is a kind of pre-race and a chance for athletes with a poor qualification to still make it into the main race. Example: 100 riders have registered. The best 32 qualify directly for the main race. Places 33 to 96 race for the remaining 32 spots.

    In some sports, such as ski cross, short track or rallycross, starting groups are called heats. In ice cross downhill a heat always consists of four riders. If a rider does not start, this is recorded as Did Not Start (DNS).

    Placements in the heats and the LCQ as well as the qualification time influence the overall result.

    ## Who starts where?

    Start gates are chosen in the order of the qualification ranking. The slowest rider gets the gate that is left over. When all riders are in position, the starter gives the command "Riders ready! Five seconds warning". The time after that varies: typically 3 to 7 seconds pass before the acoustic and visual start signal.

    ## The finish

    The last metres are often close, and a photo finish is not rare. The foremost point of the skate blade counts. Crossing the line backwards does not pay off.

    ## Who goes into which heat?

    At first glance the split into heats by qualification time looks arbitrary. It follows three simple rules:

    1. All riders are divided evenly.
    2. The faster rider gets the better starting situation.
    3. One rank of difference must not change the starting situation drastically.

    Example with 32 riders: as each heat has 4 riders, we form 4 groups of 8. Group 1 is places 1 to 8, group 2 places 9 to 16, group 3 places 17 to 24 and group 4 places 25 to 32. Each heat has one rider from each group. So that the fastest gets the best matchup, he or she races the slowest:

    - Heat 1: 01 – 16 – 17 – 32
    - Heat 2: 08 – 09 – 24 – 25

    Since two riders advance, two heats of the first round form one heat of the next round (winners of heat 1 and heat 2 meet). The two fastest riders should only meet in the final, so the second fastest is placed in the first heat of the lower half, the third fastest also in the lower half and the fourth fastest in the upper half.

    ### Heat grid for 64 riders

    | Heat | Start positions |
    |---|---|
    | 01 | 01 – 32 – 33 – 64 |
    | 02 | 16 – 17 – 48 – 49 |
    | 03 | 08 – 25 – 40 – 57 |
    | 04 | 09 – 24 – 41 – 56 |
    | 05 | 04 – 29 – 36 – 61 |
    | 06 | 13 – 20 – 45 – 52 |
    | 07 | 05 – 28 – 37 – 60 |
    | 08 | 12 – 21 – 44 – 53 |
    | 09 | 02 – 31 – 34 – 63 |
    | 10 | 15 – 18 – 47 – 50 |
    | 11 | 07 – 26 – 39 – 58 |
    | 12 | 10 – 23 – 42 – 55 |
    | 13 | 03 – 30 – 35 – 62 |
    | 14 | 14 – 19 – 46 – 51 |
    | 15 | 06 – 27 – 38 – 59 |
    | 16 | 11 – 22 – 43 – 54 |

    You can see how a race went in the heat tree of every event under [Results](/events).

- slug: zuschauer
  nav: footer
  position: 3
  title_de: Für Zuschauer
  title_en: For spectators
  body_de: |
    ## Ice Cross Weltcup – Infos für Besucher

    Ice Cross Downhill live erleben: Sowohl die Sportveranstaltung als auch die Party im Festzelt finden auf der Winterleiten statt. Vor dem Hauptbewerb finden Vorrundenläufe statt. Zeitplan und Details zum nächsten Event findest du auf der [Event-Seite](/events).

    ## Wo findet alles statt?

    Ice Cross Downhill Strecke Winterleiten
    Winterleitenhüttenstraße 1
    8750 Judenburg
    [Google Maps](https://goo.gl/maps/T3aPY1RPNdBweMcg9)

    ## Ist Eintritt zu zahlen?

    Nein, es wird kein Eintritt verlangt.

    ## Wo kann ich parken?

    Geparkt werden kann bei der Schmelzhütte und auf den Parkplätzen bis zur Zufahrt der Rodelbahn. Parkplatzordner weisen euch beim Parken ein.

    ## Ist die Veranstaltung familienfreundlich?

    Ja. Wir freuen uns wie jedes Jahr darauf, Familien und Kinder jedes Alters vor Ort begrüßen zu dürfen.

    ## Gibt es Essen und Trinken vor Ort?

    Ja. Es gibt warme Getränke im Zelt am Beginn der Strecke und in eigenen Gastro-Zelten entlang der Strecke.

    ## Gibt es Videowalls?

    Ja. An mehreren Abschnitten der Strecke gibt es Videowalls mit einer Live-Übertragung des Bildes. Die Übertragung findet nur vor Ort statt.

    ## Kann ich das Event unterstützen?

    Wir freuen uns immer über Unterstützer. Für Sponsoring und Helferanfragen erreichst du uns unter [info@ice-cross.at](mailto:info@ice-cross.at). Mehr Möglichkeiten findest du unter [Unterstütze uns](/unterstuetzung).
  body_en: |
    ## Ice Cross World Cup – visitor info

    Experience ice cross downhill live: both the sporting event and the party in the tent take place in Winterleiten. Qualifying runs take place before the main competition. Schedule and details for the next event are on the [event page](/events).

    ## Where does everything take place?

    Ice Cross Downhill Track Winterleiten
    Winterleitenhüttenstraße 1
    8750 Judenburg
    [Google Maps](https://goo.gl/maps/T3aPY1RPNdBweMcg9)

    ## Is there an entrance fee?

    No, entry is free.

    ## Where can I park?

    You can park at the Schmelzhütte and in the car parks up to the entrance of the toboggan run. Parking attendants will guide you.

    ## Is the event family friendly?

    Yes. As every year, we are happy to welcome families and children of all ages.

    ## Is there food and drink on site?

    Yes. There are hot drinks in the tent at the start of the track and in dedicated catering tents along the track.

    ## Are there video walls?

    Yes. At several sections of the track there are video walls with a live broadcast. The broadcast is only available on site.

    ## Can I support the event?

    We are always happy about supporters. For sponsoring and volunteer requests contact us at [info@ice-cross.at](mailto:info@ice-cross.at). More ways to help are on [Support us](/unterstuetzung).

- slug: unterstuetzung
  nav: footer
  position: 4
  title_de: Unterstütze uns
  title_en: Support us
  body_de: |
    Jedes Jahr investieren wir hunderte Stunden, um Ice Cross in Österreich größer und besser zu machen. Wir organisieren Events wie die ATSX Ice Cross Weltmeisterschaft, verbessern unsere Paradestrecke in Winterleiten, bieten Trainings an und vieles mehr. Dafür sind wir auf unzählige Freiwillige, Sponsoren und die Unterstützung der Fans des Sports angewiesen.

    Wenn du unsere Mission unterstützen willst, diesen großartigen Sport aufzubauen, [unterstütze uns hier](http://icecross.faninvest.com).

    Für Sponsoring und Helferanfragen: [info@ice-cross.at](mailto:info@ice-cross.at)
  body_en: |
    Every year we spend hundreds of hours to make ice cross bigger and better in Austria. We organise events like the ATSX Ice Cross World Championship, improve our flagship track in Winterleiten, organise trainings and much more. To make all of that happen we rely heavily on countless volunteers, sponsors and the support of the fans of the sport.

    If you want to support our mission of building this amazing sport, [support us here](http://icecross.faninvest.com).

    For sponsoring and volunteer requests: [info@ice-cross.at](mailto:info@ice-cross.at)

