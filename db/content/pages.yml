  body_de: |
    > Entwurf: Diese Erklärung beschreibt die tatsächliche Datenverarbeitung dieser Anwendung und muss vor dem Livegang vom Verband geprüft werden.

    ## Verantwortlicher

    Österreichischer Skate Cross Verband, Wiener Straße 58/1, 8020 Graz, [info@ice-cross.at](mailto:info@ice-cross.at). Die Kontaktdaten findest du auch im [Impressum](/impressum).

    ## Besucher der Webseite

    Beim Aufruf der Seiten verarbeitet der Server technisch notwendige Daten (IP-Adresse, Zeitpunkt, aufgerufene Seite), um die Seite auszuliefern und sicher zu betreiben. Wir setzen keine Tracking- oder Werbe-Cookies ein. Gespeichert werden nur technisch notwendige Cookies: deine Spracheinstellung und, nach dem Login, dein Sitzungs-Cookie.

    ## Fahrerlager (Login für Fahrerinnen und Fahrer)

    Der Zugang zum Fahrerlager erfolgt nur auf Einladung. Wir speichern dafür deine E-Mail-Adresse, dein Passwort (verschlüsselt) und die Daten, die du im Profil angibst: Name, Nation, Geburtsdatum, Verein/Team und Info-Text. Zusätzlich speichern wir deine Anmeldungen zu Events sowie Zeiten und Ergebnisse. Rechtsgrundlage ist die Durchführung der Teilnahme am Wettbewerb (Art. 6 Abs. 1 lit. b DSGVO).

    ## Ergebnisse und Fahrerprofile

    - **Ergebnisse:** Name und Nation sind in den Ergebnissen öffentlich, weil sie für die Wertung benötigt werden. Bei Fahrerinnen und Fahrern unter 18 Jahren (oder ohne bekanntes Geburtsdatum) zeigen wir ohne Zustimmung nur die Initialen und keine Nation.
    - **Öffentliches Profil:** Ein Profil wird nur veröffentlicht, wenn du im Fahrerlager ausdrücklich zustimmst. Du kannst die Zustimmung jederzeit widerrufen. E-Mail-Adresse und Geburtsdatum werden nie veröffentlicht.

    ## Empfänger

    Wir geben Daten nur weiter, soweit es für Anmeldung und Durchführung nötig ist (z. B. Ticketshop und internationaler Verband ATSX) oder wir gesetzlich dazu verpflichtet sind.

    ## Deine Rechte

    Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch. Schreib dazu an [info@ice-cross.at](mailto:info@ice-cross.at). Du kannst dich außerdem bei der österreichischen Datenschutzbehörde beschweren.
  body_en: |
    > Draft: This statement describes how this application actually processes data and must be reviewed by the association before going live.

    ## Controller

    Österreichischer Skate Cross Verband, Wiener Straße 58/1, 8020 Graz, Austria, [info@ice-cross.at](mailto:info@ice-cross.at). Contact details are also in the [legal notice](/impressum).

    ## Website visitors

    When you open the pages, the server processes technically necessary data (IP address, time, requested page) to deliver the site and operate it securely. We do not use tracking or advertising cookies. Only technically necessary cookies are stored: your language setting and, after login, your session cookie.

    ## Paddock (rider login)

    Access to the paddock is by invitation only. For this we store your email address, your password (encrypted) and the data you enter in your profile: name, nation, date of birth, club/team and info text. We also store your event registrations as well as times and results. The legal basis is performing your participation in the competition (Art. 6(1)(b) GDPR).

    ## Results and rider profiles

    - **Results:** Name and nation are public in the results because they are needed for the ranking. For riders under 18 (or with no known date of birth) we show only initials and no nation unless they consent.
    - **Public profile:** A profile is only published if you explicitly consent in the paddock. You can withdraw your consent at any time. Email address and date of birth are never published.

    ## Recipients

    We only pass on data where necessary for registration and running the event (e.g. ticket shop and the international federation ATSX) or where we are legally required to.

    ## Your rights

    You have the right of access, rectification, erasure, restriction of processing, data portability and objection. Write to [info@ice-cross.at](mailto:info@ice-cross.at). You can also lodge a complaint with the Austrian data protection authority.
