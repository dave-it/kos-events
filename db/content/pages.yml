- slug: training
  nav: header
  position: 1
  title_de: Training
  title_en: Training
  body_de: |
    ## Ice Cross Strecke Winterleiten

    Die Ice-Cross-Downhill-Strecke auf der Winterleiten steht den ganzen Winter für Training zur Verfügung. [Zur Preisliste](/preise)

    ## Wann ist die Strecke geöffnet?

    Wir öffnen die Strecke basierend auf den gebuchten Trainingsanfragen. Die öffentlichen Trainings können [hier gebucht werden](https://shop.entrello.app/de/icecross-austria/events/ev_37QRTjlNQM5mVXhd2fcr5l282fZ). Die aktuellen Termine findest du [im Ticketshop](https://shop.entrello.app/de/icecross-austria/events/ev_37tDv7VC6qiQ8rRT5H9OGkaXKYd).

    Gerne machen wir auch begleitete Trainings an speziellen Tagen mit einem unserer Trainer. Bitte Anfragen an [info@ice-cross.at](mailto:info@ice-cross.at).

    ## Kann ich einfach so vorbeikommen?

    Nein. Die Strecke wird nur zu den kommunizierten Zeiten bei bestehenden Buchungen geöffnet. Wir erlauben Partnern und erfahrenen Fahrerinnen und Fahrern sowie Verbänden, die Strecke für eigene Trainings zu mieten.

    ## Wie viele Fahrten sind in einem Training enthalten?

    Eine Trainingseinheit dauert immer zwei Stunden. In dieser Zeit kann die Strecke so oft benutzt werden, wie die Trainingsgäste wollen.

    ## Wo ist die Strecke?

    Ice Cross Downhill Strecke Winterleiten
    Winterleitenhüttenstraße 1
    8750 Judenburg
    [Google Maps](https://goo.gl/maps/T3aPY1RPNdBweMcg9)

    ## Verpflichtende Ausrüstung

    - Vollvisier-Helm (Moto-X, MTB-Downhill oder Hockeyhelm mit Gesichtsschutz)
    - Brustpanzer mit Schulterschutz
    - Ellbogenschützer
    - Schnittfeste Handschuhe
    - Knie- und Schienbeinschützer
    - Eislaufschuhe (ohne Zacken, Kunstlaufschuhe sind nicht erlaubt)

    ## Kann ich Ausrüstung vor Ort mieten?

    Nein. Aktuell gibt es keine Mietausrüstung vor Ort.
  body_en: |
    ## Ice Cross Track Winterleiten

    The ice cross downhill track in Winterleiten is open for training all winter long. [Price list](/preise)

    ## When is the track open?

    We open the track based on booked trainings and general interest. You can book a training slot [here](https://shop.entrello.app/de/icecross-austria/events/ev_37QRTjlNQM5mVXhd2fcr5l282fZ). Current dates are in our [ticket shop](https://shop.entrello.app/de/icecross-austria/events/ev_37tDv7VC6qiQ8rRT5H9OGkaXKYd).

    If you are interested in a special experience with one of our trainers, please contact us at [info@ice-cross.at](mailto:info@ice-cross.at).

    ## Can I just show up?

    No. You need to book a training or make an appointment with one of our trainers. We allow partners, associations and experienced riders to use the track on their own under certain conditions.

    ## How often can I go down?

    Training sessions are always two hours long. You can go as many times as you want until the session is over.

    ## Where is the track?

    Ice Cross Downhill Track Winterleiten
    Winterleitenhüttenstraße 1
    8750 Judenburg
    [Google Maps](https://goo.gl/maps/T3aPY1RPNdBweMcg9)

    ## Required equipment

    - Full-face helmet (Moto-X, MTB downhill or hockey helmet with cage)
    - Chest and shoulder protection
    - Elbow protection
    - Cut-resistant gloves (covered by protective pads on top of hand and wrist, e.g. hockey gloves)
    - Knee and shin protection
    - Ice skates (no blades with pointy ends; figure skates are not allowed)

    ## Can I rent equipment on site?

    No. We don't have rental equipment.

