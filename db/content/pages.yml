    Das Hotel befindet sich in Spielberg, mit dem Auto sind es etwa 35 Minuten zur Ice-Cross-Strecke. [Google Maps](https://maps.app.goo.gl/xM5YpJmqerJAXkrj9)

    ## Was kostet das Hotel?

    - **55 €** pro Nacht, Frühstück inklusive
    - **80 €** pro Nacht, Frühstück und Abendessen inklusive

    Verwende beim Buchen einfach den Rabattcode **ICECROSS2026**. [Hier buchen](http://www.arthotel-spielberg.at)

    Bei weiteren Fragen an das Hotel schreibe eine E-Mail an [office@arthotel-spielberg.at](mailto:office@arthotel-spielberg.at).

    ## All-inclusive-Weltcup-Paket: 400 €

    Inklusive Renngebühr, 3 Nächten (Donnerstag bis Sonntag), Frühstück und Abendessen sowie 2 Trainings (Donnerstag Nachmittag, Freitag früh). Du sparst 50 €. [Im Ticketshop buchen](https://shop.entrello.app/de/icecross-austria/events/ev_37QOfN7OM2C0vh0enXHV4pVjfQA/tickets)
  body_en: |
    ## Where is the hotel?

    The hotel is in Spielberg, about a 35-minute drive from the ice cross track. [Google Maps](https://maps.app.goo.gl/xM5YpJmqerJAXkrj9)

    ## How much does the hotel cost?

    - **€55** per night, breakfast included
    - **€80** per night, breakfast and dinner included

    Simply use our discount code **ICECROSS2026** when booking. [Book here](http://www.arthotel-spielberg.at)

    For further questions to the hotel, write an email to [office@arthotel-spielberg.at](mailto:office@arthotel-spielberg.at).

    ## All-inclusive World Cup package: €400

    Includes the race fee, 3 nights (Thursday to Sunday), breakfast and dinner and 2 trainings (Thursday afternoon, Friday morning). You save €50. [Book in the ticket shop](https://shop.entrello.app/de/icecross-austria/events/ev_37QOfN7OM2C0vh0enXHV4pVjfQA/tickets)

