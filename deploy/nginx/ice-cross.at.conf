# nginx-Eintrag für den Livegang. Erst nach dem DNS-Wechsel aktivieren (siehe docs/switchover.md).
# certbot ergänzt danach die 443-Blöcke und die Umleitung von HTTP auf HTTPS.

# www -> ohne www
server {
    listen 80;
    listen [::]:80;
    server_name www.ice-cross.at;
    return 301 https://ice-cross.at$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ice-cross.at;

    # Live-Chat (WebSocket)
    location /cable {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
