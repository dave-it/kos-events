# Produktion auf sirius: nginx (Host) -> 127.0.0.1:3012 -> Thruster (8080)/Puma im Container
services:
  web:
    # Gebaut von GitHub Actions; bin/deploy-sirius setzt IMAGE_TAG in .env auf den Commit.
    image: ghcr.io/dave-it/kos-events:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:3012:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      RAILS_MAX_THREADS: 3
      SOLID_QUEUE_IN_PUMA: "true"
      # Port 80 darf der unprivilegierte Container-User auf sirius nicht binden
      HTTP_PORT: 8080
    volumes:
      - storage:/rails/storage
    mem_limit: 500m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kos_events
      POSTGRES_PASSWORD: ${KOS_EVENTS_DATABASE_PASSWORD}
      POSTGRES_DB: kos_events_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Kein Healthcheck: er startet alle paar Sekunden Prozesse im Container, was auf sirius (OpenVZ) hängt.
    mem_limit: 256m

volumes:
  storage:
  pgdata:
